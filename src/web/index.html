<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- One file, not an inline emoji. The old data-URI drew the icon as SVG *text*, so the tab
         showed whatever emoji font the machine happened to have — and nothing at all where the
         renderer would not load one. -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d0d" />
    <script>
      // Set the theme + presentation prefs before first paint to avoid a flash of
      // the wrong palette. Keep the defaults in sync with lib/settings.ts.
      try {
        var s = JSON.parse(localStorage.getItem("pl-settings") || "{}");
        var t = s.theme || "system";
        var r = t === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : t;
        var d = document.documentElement;
        d.setAttribute("data-theme", r);
        d.setAttribute("data-shelfstyle", s.shelfStyle || "both");
        d.setAttribute("data-texture", s.texture || "both");
      } catch (e) {}
    </script>
    <title>Launchpad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
