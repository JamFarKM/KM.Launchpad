services:
  launchpad:
    build: .
    image: pipeline-launchpad:latest
    container_name: pipeline-launchpad
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADO_DEFAULT_ORG: ${ADO_DEFAULT_ORG:-BetagyDevOps}
    volumes:
      # Persists the SQLite db + PAT-encryption keys across restarts and rebuilds.
      - launchpad-data:/data
    restart: unless-stopped

volumes:
  launchpad-data:
